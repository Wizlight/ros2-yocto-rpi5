# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-counter"
BBFILE_PATTERN_meta-counter = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-counter = "6"

LAYERDEPENDS_meta-counter = "core ros2-jazzy-layer"
LAYERSERIES_COMPAT_meta-counter = "scarthgap"
